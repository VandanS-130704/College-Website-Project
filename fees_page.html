<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Pay Fees - RCOEM</title>
  <link rel="stylesheet" href="css/fees_style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
  <section class="header">
    <nav>
        <a href="index.html"><img src="https://123-321-123-321.s3.ap-southeast-2.amazonaws.com/collegeNewStarLogo.jpg" alt="RCOEM Logo" id="logo-img" style="height: 65px; width: auto; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);"></a>
        <div class="nav-links" id="navLinks">
            <span class="icon" onclick="hidemenu()">&#10005;</span>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Admission_page.html">Admission</a></li>
                <li><a href="index.html#course_call">Course</a></li>
                <li><a href="fees_page.html">Fees</a></li>
                <li><a href="Contact_page.html">Contact</a></li>
            </ul>
        </div> 
        <span class="icon" onclick="showmenu()">&#9776;</span>
    </nav>

  <form onsubmit="pay()">
    <div class="wrapper">
      <div class="r_form_wrap">
        <div class="title"><p id="header_fees">Online Pay Fees</p></div>
        <div class="r_form">
          <form method="post" onsubmit="sendmail(); reset(); return false;">
            <div class="input_wrap">
              <label for="yourname">Course</label>
              <div class="input_item">
                  <i class="fa fa-bars" aria-hidden="true" id="icon" ></i>
                <select id="course" name="cars" class="input" required>
                <option value="select"> Select the Course</option>
                <option value="btech"> B.Tech 2024-2028 Batch</option>
                <option value="mba"> MBA 2024-2026 Batch</option>
                </select>
                <br><br>
                <label for="yourname">Your UID/Enrollment no</label>
                <div class="input_item">
                <i class="fa fa-list-ol" aria-hidden="true" id="icon"></i>
                <input type="number" class="input" id="uid" placeholder="Enter the last two UID digit" >
              </div>
            </div>
            <p id="uid_detail">Ex: FCAB2101101001 to enter the: 01</p>
            <input type="button" class="button" value="Get Details" onclick="getInputValue()">
            <br><br>
            <div class="input_wrap">
              <label for="yourname">Student name</label>
              <div class="input_item">
                <i class="fa fa-user" id="icon"></i>
                <p id="demo" class="input" ></p>
              </div>
            </div>
            <div class="input_wrap">
               <label for="yourname">Pending Fees Detail</label>
               <div class="input_item">
                 <i class="fa fa-credit-card" id="icon"></i>
                 <p id="demo1" class="input" ></p>
               </div>
            </div>
            <input type="button" class="button" value="Pay Fees" onclick="sendmail()">
        </form>
        </div>
      </div>
    </div>
  </form>
  </section>
  <div class="none_div"></div>

<script src="javascript/fees_script.js"></script>
<script src="javascript/main_script.js"></script>
<script>
  function sendmail(){ alert("Thank you - Team RCOEM"); }
</script>
</body>
</html>
